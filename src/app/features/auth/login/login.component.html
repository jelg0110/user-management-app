<div class="full-width centered py-2 container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="container-sm stack">
    <div class="centered">
      <img src="assets/images/login.svg" alt="Login logo" class="login-image" />
    </div>
    <h1 class="mat-display-large text-primary text-center">CHARLIE’S CAT LOVERS CLUB</h1>
    <div class="stack stack-sm">
      <h2 class="mat-headline-medium text-primary text-center m-0">Welcome Back</h2>
      <span class="mat-body-small text-center">Enter your username and password to sign in</span>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" placeholder="Your username" />
      @if (getError('username'); as errorMsg) {
        <mat-error>{{ errorMsg }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
      <button
        matIconButton
        matSuffix
        type="button"
        placeholder="Your password"
        (click)="passwordClickEvent($event)"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()"
      >
        <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      @if (getError('password'); as errorMsg) {
        <mat-error>{{ errorMsg }}</mat-error>
      }
    </mat-form-field>

    <button matButton="filled" color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="30"></mat-spinner>
      } @else {
        <span>Sign in</span>
      }
    </button>

    @if (error()) {
      <span class="mat-body-large text-error text-strong text-center">{{ error() }}</span>
    }

    <span class="mat-body-small text-center">Having trouble signing in? <a class="text-success pointer" href="#">Contact Support</a></span>
  </form>
</div>
