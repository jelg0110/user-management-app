@if (user()) {
  <mat-card class="user-detail">
    <div class="user-detail-header">
      <h3 class="mat-headline-medium">Details</h3>
      <button mat-button color="primary" (click)="goBack()">Back</button>
    </div>

    <div class="grid grid-sm-4">
      <form class="user-detail-form span-sm-3 grid grid-sm-4 order-2 order-sm-1">
        <mat-form-field appearance="fill" class="span-sm-2">
          <mat-label>Full Name</mat-label>
          <input matInput [value]="user().name" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill" class="span-sm-2">
          <mat-label>Email</mat-label>
          <input matInput [value]="user().email" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Phone</mat-label>
          <input matInput [value]="user().phone" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput [value]="user().username" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Gender</mat-label>
          <input matInput [value]="user().gender" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Age</mat-label>
          <input matInput [value]="user().age" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill" class="span-sm-4">
          <mat-label>Location</mat-label>
          <input matInput [value]="user().location" disabled />
        </mat-form-field>
      </form>

      <div class="order-1 order-sm-2">
        <div class="avatar-container">
          <img [src]="user().picture" alt="{{ user().name }}" class="avatar-large" />
        </div>
      </div>
    </div>
  </mat-card>
}
